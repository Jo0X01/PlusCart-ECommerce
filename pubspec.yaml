name: plus_cart
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_svg: ^2.3.0
  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: 10.1.2
  dartz: ^0.10.1
  firebase_core: ^4.12.0
  firebase_auth: ^6.5.5
  cloud_firestore: ^6.7.0 
  firebase_storage: ^13.4.4
  firebase_messaging: ^16.4.2
  firebase_crashlytics: ^5.2.5
  firebase_analytics: ^12.4.4
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  rename_app: ^1.6.6
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-logo.png"


flutter_native_splash:
  color: "#1A1A1A"

  android_12:
    color: "#1A1A1A"
    image: "assets/images/splash_android_12.png"